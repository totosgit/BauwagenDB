<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- "default" = dunkle Statusleistenschrift. Bei "black-translucent"
         wäre sie weiß und auf dem hellen Holz unlesbar. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Blauwagen Verwaltung" />
    <title>Blauwagen Verwaltung</title>
    <!-- Statusleiste in der Holzfarbe der Kopfleiste, damit die App auf dem
         iPhone bis nach oben durchgeht -->
    <meta name="theme-color" content="#c19c6d" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/icon-192.png" type="image/png" sizes="192x192" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
